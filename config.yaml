# eki's seed configuration.
#
# This file is only read once: on a fresh install, to fill the providers
# table. After that, providers live in ~/.eki/eki.db and are edited in the
# app (Models & routing → Add provider) or over the API. Editing this file
# later changes nothing.
#
# cost.tier decides routing order:
#   0   local, free
#   50  a subscription you already pay for
#   100 metered API

db_path: ~/.eki/eki.db

quota:
  ceiling: 0.99                 # a window at or above this counts as spent

# Memory ceiling for local model servers. Left unset, eki works it out from
# the memory this Mac has installed.
# memory:
#   ceiling_gb: 37.4

backends:
  - key: claude
    kind: claude_code
    label: Claude Code
    cost:
      tier: 50
      note: subscription
    quota_source: claude        # read from Claude Code's own status line, opt-in
    capabilities:
      context_tokens: 200000
      tools: true
      repo: true
      vision: true
    options:
      binary: claude            # your own install, run as you; eki holds no login
      # model: opus             # omit for the CLI's default
      timeout_seconds: 900

  - key: codex
    kind: codex
    label: Codex CLI
    cost:
      tier: 50
      note: subscription
    quota_source: codex
    capabilities:
      context_tokens: 200000
      # Needs the `codex-code-mode-host` helper beside the codex binary; the
      # standalone install doesn't always ship it. eki's provider test says
      # so and offers to fetch the matching one from Codex's own releases.
      tools: true
      repo: true
    options:
      binary: codex
      sandbox: read-only        # workspace-write is used automatically with a folder
      timeout_seconds: 900

# Anything else — an MLX server, Ollama, LM Studio, ComfyUI, an API key — is
# added in the app, which can also find what's already running on this Mac.
# The shape, if you'd rather seed it here:
#
#  - key: qwen
#    kind: mlx
#    label: Qwen 27B (local)
#    cost: {tier: 0, note: "local, free"}
#    capabilities: {context_tokens: 32000}
#    options: {base_url: "http://127.0.0.1:8080"}
#
# local_models:
#   - key: qwen
#     backend: qwen
#     port: 8080
#     gb: 14.5                  # measured resident size, so eki can refuse a bad start
#     start: ~/.eki/models/qwen/start.sh
#     stop: ~/.eki/models/qwen/stop.sh
