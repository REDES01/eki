<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eki · Goals</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --sunk: #efede8; --line: #e3e0d9; --line-2: #d6d2c9;
    --ink: #1d1c1a; --ink-2: #5d5a53; --ink-3: #8f8b82;
    --accent: #c9622b; --accent-soft: #f6e3d7;
    --ok: #2f8f5b; --ok-soft: #dcefe3; --wait: #b7791f; --wait-soft: #f6ead3;
    --danger: #b3412f; --danger-soft: #f6dcd6; --info-soft: #e3e9f4; --info: #3d5f94;
    --radius: 12px; --shadow: 0 1px 2px rgba(20,18,15,.06), 0 2px 8px rgba(20,18,15,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a18; --surface: #242320; --sunk: #2c2b27; --line: #36342f; --line-2: #45423c;
      --ink: #ecebe7; --ink-2: #b3afa6; --ink-3: #807c74;
      --accent: #e0834f; --accent-soft: #3b2a20;
      --ok: #52b67f; --ok-soft: #1f3327; --wait: #d9a23e; --wait-soft: #372c19;
      --danger: #e0715e; --danger-soft: #3d2320; --info-soft: #1f2838; --info: #8fb0e6;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  button, input, select, textarea { font: inherit; }
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
           backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 980px; margin: 0 auto; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  h1 { font-size: 16px; margin: 0; font-weight: 650; } h1 a { color: inherit; text-decoration: none; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; min-width: 0; flex: 1 1 240px; }
  .status .text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .dot.working { background: var(--ok); animation: pulse 1.6s ease-in-out infinite; }
  .dot.waiting, .dot.stepped { background: var(--wait); }
  @keyframes pulse { 50% { opacity: .35; } }
  .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: none; padding: 5px 12px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  label.check { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 20px 80px; }
  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 8px;

  .btn:hover { border-color: var(--line-2); color: var(--ink); }

  .btn.primary:disabled { opacity: .5; cursor: default; }
  .btn.danger { color: var(--danger); } .btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.small { font-size: 11.5px; padding: 3px 9px; border-radius: 7px; }
  .muted { color: var(--ink-3); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  textarea.input, input.input, select.input { border: 1px solid var(--line); background: var(--surface); color: var(--ink);
                border-radius: 8px; padding: 7px 10px; font-size: 13.5px; }
  textarea.input { width: 100%; resize: vertical; }
  textarea.big { width: 100%; border: 0; padding: 4px 2px; font-size: 16px; min-height: 64px; background: transparent;
                 outline: none; resize: vertical; color: var(--ink); }
  .composer { padding: 14px 16px; margin-bottom: 22px; }
  .folder { display: flex; gap: 6px; align-items: center; min-width: 0; }
  .folder .input { flex: 1; min-width: 0; }
  .folder .btn { flex: none; }
  .composer .opts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 8px;
                    padding-top: 10px; border-top: 1px solid var(--line); }
  .composer .opts .grow { flex: 1 1 200px; }
  .composer .examples { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .chip { border: 1px solid var(--line); background: var(--bg); color: var(--ink-2); border-radius: 99px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
  .chip:hover { color: var(--ink); border-color: var(--line-2); }
  .err { color: var(--danger); font-size: 12.5px; margin-top: 6px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 650; margin: 0 0 10px; }
  .goals { display: flex; flex-direction: column; gap: 10px; }

                -webkit-box-orient: vertical; overflow: hidden; border-left: 2px solid var(--line); padding-left: 10px; }
  .goal .acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .badge { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px;
           background: var(--sunk); color: var(--ink-2); white-space: nowrap; }

  .confirm { display: inline-flex; gap: 6px; align-items: center; background: var(--danger-soft); color: var(--danger);
             border-radius: 9px; padding: 3px 5px 3px 10px; font-size: 12.5px; flex-wrap: wrap; }
  .empty { text-align: center; color: var(--ink-3); padding: 40px 20px; }
  .back { color: var(--ink-3); text-decoration: none; font-size: 13px; } .back:hover { color: var(--ink); }
  .goal-head { margin: 10px 0 16px; }
  .goal-head .text { font-size: 19px; font-weight: 650; line-height: 1.35; letter-spacing: -.01em; }
  .goal-head .meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--ink-3); font-size: 12.5px; margin-top: 8px; }
  .goal-head .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .note { background: var(--wait-soft); border-radius: 9px; padding: 8px 12px; font-size: 13px; margin-top: 10px; }
  .thread { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
  .turn-goal { display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
  .turn-goal::before, .turn-goal::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .msg { padding: 12px 14px; }
  .msg.you { background: var(--accent-soft); border-color: transparent; box-shadow: none; margin-left: 12%; }
  .msg .who { font-size: 11.5px; color: var(--ink-3); margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
  .msg .body { font-size: 13.5px; color: var(--ink); overflow-wrap: anywhere; }
  .body p { margin: 0 0 8px; } .body ul, .body ol { margin: 0 0 8px; padding-left: 20px; } .body li { margin-bottom: 4px; }
  .body h1, .body h2, .body h3, .body h4 { font-size: 14.5px; margin: 10px 0 6px; }
  .body pre { background: var(--sunk); border-radius: 8px; padding: 8px 10px; overflow-x: auto; font-size: 12px; }
  .body code { background: var(--sunk); border-radius: 4px; padding: 0 4px; font-size: 12.5px; }
  .body pre code { background: none; padding: 0; }
  .body img { max-width: 100%; max-height: 420px; border-radius: 9px; display: block; margin: 6px 0; }
  .body a { color: var(--accent); }
  .mark { font-size: 11px; font-weight: 650; border-radius: 99px; padding: 1px 8px; background: var(--sunk); color: var(--ink-2); }
  .mark.done { background: var(--ok-soft); color: var(--ok); } .mark.waiting { background: var(--info-soft); color: var(--info); }
  .working-line { color: var(--ok); font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .spinner { width: 12px; height: 12px; border: 2px solid var(--line-2); border-top-color: var(--ok); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .reply { margin-top: 18px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-end; }
  .reply textarea { flex: 1; border: 0; background: transparent; resize: none; outline: none; font-size: 14px; min-height: 40px; }
  .edit { padding: 14px 16px; margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  nav.tabs { display: inline-flex; gap: 2px; background: var(--sunk); border-radius: 9px; padding: 2px; }
  nav.tabs a { color: var(--ink-2); text-decoration: none; font-size: 13px; font-weight: 650; padding: 3px 13px; border-radius: 7px; }
  nav.tabs a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .section { margin-top: 24px; }
  .self-head { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .self-head .line { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .self-head .big { font-size: 15px; font-weight: 650; }
  .chipk { font-size: 11px; font-weight: 650; border-radius: 99px; padding: 1px 8px; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
  .chipk.fault { background: var(--danger-soft); color: var(--danger); } .chipk.roadmap { background: var(--info-soft); color: var(--info); }
  .chipk.asked { background: var(--accent-soft); color: var(--accent); } .chipk.note { background: var(--ok-soft); color: var(--ok); }
  .ck { font-size: 11px; border-radius: 6px; padding: 1px 7px; margin-right: 4px; background: var(--sunk); color: var(--ink-3); white-space: nowrap; }
  .ck.ok { background: var(--ok-soft); color: var(--ok); } .ck.bad { background: var(--danger-soft); color: var(--danger); }
  .change { padding: 12px 16px; }
  .change .top { display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; }
  .change .title { font-weight: 600; font-size: 14px; }
  .change .meta, .goal-head .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .change .meta { color: var(--ink-3); font-size: 12px; margin-top: 4px; }
  .change .acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .rows { display: flex; flex-direction: column; }
  .rowline { display: flex; gap: 10px; align-items: center; padding: 8px 2px; border-bottom: 1px solid var(--line); font-size: 13px; min-width: 0; }
  .rowline:last-child { border-bottom: 0; }
  .rowline .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rowline .when { color: var(--ink-3); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  pre.diff { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow-x: auto;
             font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; }
  pre.diff .add { color: var(--ok); } pre.diff .del { color: var(--danger); } pre.diff .hunk { color: var(--info); }
  pre.diff .file { color: var(--ink); font-weight: 650; }
  .suggestion { padding: 10px 0; border-top: 1px solid var(--line); }
  .areas { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .area { display: inline-flex; gap: 4px; align-items: center; background: var(--sunk); border-radius: 8px; padding: 2px 4px 2px 9px; font-size: 12px; }
  .area button { border: 0; background: none; color: var(--ink-3); cursor: pointer; font-size: 14px; line-height: 1; }
  @media (max-width: 640px) { .bar { padding: 10px 16px; } main { padding: 16px 16px 60px; } .msg.you { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1><nav class="tabs" aria-label="Board"><a href="#/" id="tab-goals">Goals</a><a href="#/self" id="tab-self" title="eki working on itself">Self</a></nav></h1>
    <div class="status"><i class="dot" id="dot"></i><span class="text" id="status">Connecting…</span></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Background work">
        <button data-on="1">On</button><button data-on="0">Off</button>
      </div>
      <label class="check" title="Otherwise it runs whenever the machine has room, stepping aside for you and other apps"><input type="checkbox" id="away"> Only when I'm away</label>
    </div>
  </div>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc = encodeURIComponent;
const S = { view: null, thread: null, threadOf: "", sig: "", confirm: "", editing: false, error: "", sending: false,
            self: null, change: null, changeThread: null, diff: null, diffFor: "", selfDraft: "", acting: {},
            draft: { text: "", kind: "once", at: "09:00", day: "0", hours: "4", folder: "", spare: false, screen: false, on_time: false, fresh: false, touched: false } };
const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const EXAMPLES = [
  "Every morning, look at my X and propose 3 posts in my voice.",
  "Make 20 NPCs for my game — a bio, a portrait and three lines each.",
  "Keep the tests in this repo passing; fix what breaks on a branch.",
];

async function api(path, method, body) {
  const r = await fetch(path, method ? { method, headers: {"Content-Type": "application/json"},
                                         body: body === undefined ? undefined : JSON.stringify(body) } : {});
  if (!r.ok) { let m = await r.text(); try { m = JSON.parse(m).detail || m; } catch {} throw new Error(m); }
  return r.json();
}
function route() {
  const p = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  if (p[0] === "self") return p[1] ? { page: "change", id: p[1] } : { page: "self" };
  return p[0] === "g" && p[1] ? { page: "goal", id: p[1] } : { page: "home" };
}

// ---- when ----------------------------------------------------------------------------------
function whenOf(d) {
  if (d.kind === "daily") return { kind: "daily", at: d.at || "09:00" };
  if (d.kind === "weekdays") return { kind: "daily", at: d.at || "09:00", days: [0, 1, 2, 3, 4] };
  if (d.kind === "weekly") return { kind: "daily", at: d.at || "09:00", days: [Number(d.day)] };
  if (d.kind === "interval") return { kind: "interval", minutes: Math.max(15, Math.round(Number(d.hours || 4) * 60)) };
  return { kind: "once" };
}
function draftOf(when) {
  const d = { kind: "once", at: "09:00", day: "0", hours: "4" };
  if (when?.kind === "interval") { d.kind = "interval"; d.hours = String(when.minutes / 60); }
  if (when?.kind === "daily") {
    d.at = when.at; const days = when.days || [0, 1, 2, 3, 4, 5, 6];
    d.kind = days.length === 7 ? "daily" : days.join() === "0,1,2,3,4" ? "weekdays" : "weekly";
    d.day = String(days[0] ?? 0);
  }
  return d;
}
// a first guess at "when" from the words; the choice stays yours
function guessWhen(text, d) {
  const t = text.toLowerCase();
  const time = t.match(/\bat (\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/);
  if (time) {
    let h = Number(time[1]);
    if (time[3] === "pm" && h < 12) h += 12;
    if (time[3] === "am" && h === 12) h = 0;
    if (h < 24) d.at = String(h).padStart(2, "0") + ":" + (time[2] || "00");
  }
  const hours = t.match(/every (\d+) ?(hours?|h\b)/);
  const dayName = DAYS.findIndex(n => t.includes("every " + n.toLowerCase()));
  if (hours) { d.kind = "interval"; d.hours = hours[1]; }
  else if (/every hour|hourly/.test(t)) { d.kind = "interval"; d.hours = "1"; }
  else if (/weekday/.test(t)) d.kind = "weekdays";
  else if (dayName >= 0) { d.kind = "weekly"; d.day = String(dayName); }
  else if (/every week|weekly/.test(t)) { d.kind = "weekly"; d.day = "0"; }
  else if (/every (day|morning|evening|night)|daily|each (day|morning)/.test(t)) {
    d.kind = "daily"; if (!time) d.at = /evening|night/.test(t) ? "19:00" : "09:00"; }
  else d.kind = "once";
}
function whenControls(d, prefix) {
  return `<select class="input" data-w="kind" data-for="${prefix}">
      <option value="once" ${d.kind === "once" ? "selected" : ""}>Once, until it's done</option>
      <option value="daily" ${d.kind === "daily" ? "selected" : ""}>Every day</option>
      <option value="weekdays" ${d.kind === "weekdays" ? "selected" : ""}>Weekdays</option>
      <option value="weekly" ${d.kind === "weekly" ? "selected" : ""}>Every week</option>
      <option value="interval" ${d.kind === "interval" ? "selected" : ""}>Every few hours</option></select>
    ${d.kind === "weekly" ? `<select class="input" data-w="day" data-for="${prefix}">${DAYS.map((n, i) => `<option value="${i}" ${String(i) === d.day ? "selected" : ""}>on ${n}</option>`).join("")}</select>` : ""}
    ${["daily", "weekdays", "weekly"].includes(d.kind) ? `<span class="muted">at</span><input class="input" type="time" data-w="at" data-for="${prefix}" value="${esc(d.at)}">` : ""}
    ${d.kind === "interval" ? `<span class="muted">every</span><input class="input" type="number" min="0.25" step="0.25" style="width:80px" data-w="hours" data-for="${prefix}" value="${esc(d.hours)}"><span class="muted">hours</span>` : ""}`;
}

// ---- text ----------------------------------------------------------------------------------
const imgUrl = p => `/api/goals/file?path=${enc(decodeURIComponent(p))}`;
function inline(s) {
  return esc(s)
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, a, p) => /^https?:/.test(p) ? `<img alt="${a}" src="${p}">` : `<img alt="${a}" src="${imgUrl(p)}">`)
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s.,;:!?)]|$)/g, "$1<em>$2</em>");
}
function md(text) {
  let out = "", list = "", code = false, buf = [];
  const close = () => { if (list) { out += `</${list}>`; list = ""; } };
  for (const raw of String(text || "").split("\n")) {
    if (/^```/.test(raw.trim())) { if (code) { out += `<pre><code>${esc(buf.join("\n"))}</code></pre>`; buf = []; code = false; } else { close(); code = true; } continue; }
    if (code) { buf.push(raw); continue; }
    const line = raw.trim();
    if (!line) { close(); continue; }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { close(); out += `<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`; continue; }
    const ul = line.match(/^[*\-•]\s+(.*)$/), ol = line.match(/^\d+[.)]\s+(.*)$/);
    if (ul || ol) { const want = ul ? "ul" : "ol"; if (list !== want) { close(); out += `<${want}>`; list = want; }
                   out += `<li>${inline((ul || ol)[1])}</li>`; continue; }
    close(); out += `<p>${inline(line)}</p>`;
  }
  if (code) out += `<pre><code>${esc(buf.join("\n"))}</code></pre>`;
  close(); return out;
}
const MARK = /^\s*\**\s*GOAL\s*:\s*(done|continue|waiting)\b.*$/gim;
function splitMark(text) {
  let m, last = "";
  const re = new RegExp(MARK.source, "gim");
  while ((m = re.exec(text || ""))) last = m[1].toLowerCase();
  return { body: String(text || "").replace(MARK, "").trim(), mark: last };
}
const plain = t => splitMark(t).body.replace(/!\[[^\]]*\]\([^)]*\)/g, "[picture]").replace(/[#*`>]/g, "").replace(/\s+/g, " ").trim();
const STATUS = { working: "Working", queued: "Up next", scheduled: "Scheduled", waiting: "Waiting for you", idle: "Nothing to do",
                 paused: "Paused", done: "Done", stuck: "Stuck", blocked: "Can't start", away: "When you're away" };
const ago = t => { if (!t) return ""; const s = Date.now() / 1000 - t;
  return s < 90 ? "just now" : s < 5400 ? Math.round(s / 60) + " min ago" : s < 129600 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " days ago"; };
const next = t => { if (!t) return ""; const d = new Date(t * 1000);
  return "next " + d.toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" }); };

// ---- header ---------------------------------------------------------------------------------
function header() {
  const v = S.view; if (!v) return;
  const sh = v.shift || {}, st = sh.state || "idle";
  $("#dot").className = "dot " + (st === "stepped out" ? "stepped" : st);
  const label = {working: "Working", waiting: "Waiting", idle: "Idle", off: "Off", "stepped out": "Stepped aside"}[st] || st;
  $("#status").textContent = `${label} — ${sh.why || ""}`; $("#status").title = $("#status").textContent;
  for (const b of document.querySelectorAll("[data-on]")) b.setAttribute("aria-pressed", String((b.dataset.on === "1") === v.on));
  $("#away").checked = v.when === "away";
  const self = ["self", "change"].includes(route().page);
  $("#tab-goals").toggleAttribute("aria-current", !self); if (!self) $("#tab-goals").setAttribute("aria-current", "page");
  $("#tab-self").toggleAttribute("aria-current", self); if (self) $("#tab-self").setAttribute("aria-current", "page");
}

// what a goal may use: your subscriptions; the screen — which needs them, and waits for you to be away
function usesChecks(d, k) {
  return `<label class="check" title="Only when that subscription is under pace for the week, and never its last 30%"><input type="checkbox" id="${k}-spare" ${d.spare || d.screen ? "checked" : ""} ${d.screen ? "disabled" : ""}> May use my subscriptions</label>
    ${d.kind === "once" ? "" : `<label class="check" title="At the time, whatever else the machine is doing — within its budget. One the Mac slept through by hours is skipped."><input type="checkbox" id="${k}-on_time" ${d.on_time ? "checked" : ""}> On time</label>
    <label class="check" title="Each time in a new thread, instead of carrying on the last one"><input type="checkbox" id="${k}-fresh" ${d.fresh ? "checked" : ""}> Fresh each time</label>`}
    <label class="check" title="Looking at and using the screen — its turns run only while you're away, and step out when you're back. It uses your subscriptions' spare room: that takes a model that can see."><input type="checkbox" id="${k}-screen" ${d.screen ? "checked" : ""}> May use the screen while I'm away</label>`;
}
function usesText(g) {
  const how = g.repeats ? (g.on_time ? " · on time" : "") + (g.fresh ? " · fresh each time" : "") : "";
  return (g.screen ? "uses the screen when you're away · may use your subscriptions (spare room only)"
       : g.spare ? "may use your subscriptions (spare room only)" : "only models on this machine") + how;
}

// ---- the list ----------------------------------------------------------------------------------
function home() {
  const d = S.draft, goals = S.view?.goals || [];
  let h = `<div class="card composer">
    <textarea class="big" id="new-text" rows="2" placeholder="What should eki keep doing?">${esc(d.text)}</textarea>
    ${d.text ? "" : `<div class="examples">${EXAMPLES.map(e => `<button class="chip" data-example="${esc(e)}">${esc(e)}</button>`).join("")}</div>`}
    <div class="opts">${whenControls(d, "new")}
      <span class="folder grow"><input class="input" id="new-folder" placeholder="Folder to work in (optional) — e.g. ~/games/ashfall" value="${esc(d.folder)}"><button class="btn" data-pick="new" title="Choose a folder">Choose…</button></span>
      ${usesChecks(d, "new")}
      <button class="btn primary" data-add ${d.text.trim() ? "" : "disabled"}>Add goal</button></div>
    ${S.error ? `<div class="err">${esc(S.error)}</div>` : ""}</div>`;
  if (!goals.length) return h + `<div class="empty">No goals yet. Write one above — the way you'd ask in a chat.<br>eki gives it turns whenever the machine has room, and you answer it in its thread.</div>`;
  h += `<div class="label">Goals</div><div class="goals">` + goals.map(g => {
    const k = "rm:" + g.id;
    const last = plain(g.last);
    return `<div class="card goal" data-open="${g.kind === "self" ? "self" : esc(g.id)}">
      <div class="top"><div><div class="text">${esc(g.text)}</div>
        <div class="meta">${g.kind === "self" ? "eki's own code · " : ""}${esc(g.when_text)}${g.folder ? " · " + esc(g.folder.split("/").pop()) : ""}${g.screen ? " · uses the screen when you're away" : g.spare ? " · may use subscriptions" : ""}${g.last_backend ? " · " + esc(g.last_backend) : ""}${g.last_turn_at ? " · " + ago(g.last_turn_at) : ""}${g.status === "scheduled" ? " · " + next(g.next_at) : ""}</div></div>
        <span class="badge ${esc(g.status)}">${STATUS[g.status] || esc(g.status)}</span></div>
      ${g.note ? `<div class="meta" style="color:var(--wait)">${esc(g.note)}</div>` : ""}
      ${last ? `<div class="last">${esc(last.slice(0, 400))}</div>` : ""}
      <div class="acts">
        <button class="btn small" data-run="${esc(g.id)}">Run now</button>
        <button class="btn small" data-pause="${esc(g.id)}" data-to="${g.state === "paused" ? "active" : "paused"}">${g.state === "paused" ? "Resume" : "Pause"}</button>
        ${S.confirm === k ? `<span class="confirm">Delete this goal? Its thread stays in your history. <button class="btn small danger solid" data-rm="${esc(g.id)}">Delete</button><button class="btn small" data-cancel>Cancel</button></span>`
                          : `<button class="btn small danger" data-ask="${esc(k)}">Delete</button>`}</div></div>`;
  }).join("") + `</div>`;
  return h;
}

// ---- one goal: its thread ------------------------------------------------------------------------
function goalPage(r) {
  const g = (S.view?.goals || []).find(x => x.id === r.id);
  if (!g) return `<a class="back" href="#/">← Goals</a><div class="empty">That goal isn't here any more.</div>`;
  const k = "rm:" + g.id;
  let h = `<a class="back" href="#/">← Goals</a><div class="goal-head">`;
  if (S.editing) {
    const d = S.editDraft;
    h += `<div class="card edit"><textarea class="input" id="edit-text" rows="3">${esc(d.text)}</textarea>
      <div class="row">${whenControls(d, "edit")}</div>
      <div class="row"><span class="folder" style="flex:1"><input class="input" id="edit-folder" placeholder="Folder to work in (optional)" value="${esc(d.folder)}"><button class="btn" data-pick="edit" title="Choose a folder">Choose…</button></span>
        ${usesChecks(d, "edit")}</div>
      <div class="row"><button class="btn primary" data-save>Save</button><button class="btn" data-cancel-edit>Cancel</button>
        ${S.error ? `<span class="err">${esc(S.error)}</span>` : ""}</div></div>`;
  } else {
    h += `<div class="text">${esc(g.text)}</div>
      <div class="meta"><span class="badge ${esc(g.status)}">${STATUS[g.status] || esc(g.status)}</span>
        <span>${esc(g.when_text)}${g.status === "scheduled" ? " · " + next(g.next_at) : ""}</span>
        ${g.folder ? `<span title="${esc(g.folder)}">${esc(g.folder)}</span>` : ""}
        <span>${usesText(g)}</span>
        <span>${g.turns} turn${g.turns === 1 ? "" : "s"}</span></div>
      ${g.note ? `<div class="note">${esc(g.note)}${g.note.includes("subscription") && !g.spare && !g.screen ? " — Edit it and tick “May use my subscriptions”." : ""}</div>` : ""}
      <div class="acts"><button class="btn" data-run="${esc(g.id)}">Run now</button>
        <button class="btn" data-pause="${esc(g.id)}" data-to="${g.state === "paused" ? "active" : "paused"}">${g.state === "paused" ? "Resume" : "Pause"}</button>
        <button class="btn" data-edit>Edit</button>
        ${S.confirm === k ? `<span class="confirm">Delete this goal? Its thread stays in your history. <button class="btn small danger solid" data-rm="${esc(g.id)}">Delete</button><button class="btn small" data-cancel>Cancel</button></span>`
                          : `<button class="btn danger" data-ask="${esc(k)}">Delete</button>`}</div>`;
  }
  h += `</div><div class="thread">`;
  const turns = S.thread?.turns || [];
  if (!g.conversation) h += `<div class="empty">No turns yet — it gets its first as soon as the machine has room.</div>`;
  for (const t of turns) {
    const text = t.content || "";
    if (t.role === "user" && text.startsWith("[eki · goal")) {
      const when = text.match(/^\[eki · goal · ([^\]]+)\]/);
      h += `<div class="turn-goal">${when ? "Turn · " + esc(when[1]) : "Turn"}</div>`;
      continue;
    }
    if (t.role === "user") { h += `<div class="card msg you"><div class="who">You</div><div class="body">${md(text)}</div></div>`; continue; }
    if (t.role !== "assistant") continue;
    const { body, mark } = splitMark(text);
    h += `<div class="card msg"><div class="who">${esc(t.backend || "")}${mark ? `<span class="mark ${mark}">${mark === "done" ? "done" : mark === "waiting" ? "waiting for you" : "will carry on"}</span>` : ""}</div>
      <div class="body">${md(body)}</div></div>`;
  }
  if (S.thread?.active_run) h += `<div class="working-line"><span class="spinner"></span>Working on it…</div>`;
  h += `</div>`;
  if (g.conversation) {
    h += `<div class="card reply"><textarea id="reply" rows="2" placeholder="${g.status === "waiting" ? "Answer it — it carries on after" : "Reply in this thread — feedback it keeps in mind"}"></textarea>
      <button class="btn primary" data-send ${S.sending ? "disabled" : ""}>Send</button></div>`;
  }
  return h;
}

// ---- eki working on itself ------------------------------------------------------------------------
const SOURCE = { asked: "you asked", fault: "a fault", roadmap: "ROADMAP", note: "weekly note", undo: "undo" };
const CSTATE = { proposed: "Waiting for you", conflicts: "Doesn't fit on top", applying: "Applying", applied: "Applied",
  "rolled back": "Rolled back", discarded: "Discarded", unfit: "Didn't pass", stopped: "Didn't finish",
  "no change": "Nothing changed", "not started": "Not started", undoing: "Undoing", undone: "Taken back", gone: "Gone" };
const CBADGE = { proposed: "waiting", conflicts: "blocked", applying: "working", undoing: "working", applied: "done",
  "rolled back": "stuck", unfit: "stuck", stopped: "stuck", discarded: "paused", undone: "paused" };
const srcChip = s => `<span class="chipk ${esc(s)}">${esc(SOURCE[s] || s)}</span>`;
const checksOf = c => (c.report?.checks || []).map(k =>
  `<span class="ck ${k.skipped ? "" : k.ok ? "ok" : "bad"}" title="${esc(k.detail)}">${esc(k.name)}${k.skipped ? " –" : k.ok ? " ✓" : " ✗"}</span>`).join("");
const filesOf = c => { const n = (c.files || []).length; return n ? `${n} file${n === 1 ? "" : "s"}` : ""; };
const byWhom = c => c.backend && c.backend !== "eki" ? "by " + esc(c.backend) : "by eki";
const when = t => new Date(t * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });

function changeActs(c, withDiff) {
  const busy = S.acting[c.id];
  if (busy) return `<span class="working-line"><span class="spinner"></span>${esc(busy)}…</span>`;
  const out = [];
  if (withDiff) out.push(`<a class="btn small" href="#/self/${enc(c.id)}">Read it</a>`);
  if (["proposed", "conflicts", "rolled back"].includes(c.state) && c.fit && !(c.protected || []).length)
    out.push(`<button class="btn small primary" data-cact="apply" data-id="${esc(c.id)}">Apply</button>`);
  if (["proposed", "conflicts", "unfit", "stopped", "rolled back"].includes(c.state))
    out.push(S.confirm === "dc:" + c.id
      ? `<span class="confirm">Discard it? Its branch goes too. <button class="btn small danger solid" data-cact="discard" data-id="${esc(c.id)}">Discard</button><button class="btn small" data-cancel>Cancel</button></span>`
      : `<button class="btn small danger" data-ask="dc:${esc(c.id)}">Discard</button>`);
  if (c.state === "applied")
    out.push(S.confirm === "un:" + c.id
      ? `<span class="confirm">Take it back? eki makes the revert, checks it, applies it. <button class="btn small danger solid" data-cact="undo" data-id="${esc(c.id)}">Undo</button><button class="btn small" data-cancel>Cancel</button></span>`
      : `<button class="btn small" data-ask="un:${esc(c.id)}">Undo</button>`);
  return out.join("");
}

function changeCard(c) {
  const why = (c.protected || []).length ? "Touches what eki may not change alone (" + c.protected.join(", ") + ") — read it and merge it yourself"
            : c.why || "";
  return `<div class="card change">
    <div class="top"><div style="min-width:0"><div class="title">${esc(c.title)}</div>
      <div class="meta">${srcChip(c.source || "asked")}<span>${byWhom(c)}</span>${filesOf(c) ? `<span>· ${filesOf(c)}</span>` : ""}<span>· ${ago(c.state_at)}</span></div></div>
      <span class="badge ${CBADGE[c.state] || ""}">${esc(CSTATE[c.state] || c.state)}</span></div>
    ${checksOf(c) ? `<div class="meta" style="margin-top:8px">${checksOf(c)}</div>` : ""}
    ${why ? `<div class="meta" style="color:var(--wait)">${esc(why)}</div>` : ""}
    <div class="acts">${changeActs(c, true)}</div></div>`;
}

function selfPage() {
  const v = S.self;
  if (!v) return `<div class="empty">Loading…</div>`;
  if (!v.can) return `<div class="empty">${esc(v.why_not)}</div>`;
  const g = v.goal, on = !!g && g.state === "active", now = v.working[0];
  const going = v.working.filter(i => i.phase !== "merging"), merging = v.merging || [];
  const status = !g ? "Off — eki changes itself only when you ask."
    : g.state === "paused" ? "Paused — nothing new starts."
    : g.state === "stuck" ? "Stopped: " + (g.note || "its turns kept failing")
    : going.length > 1 ? `Working on ${going.length} changes at once`
    : now ? `Working on “${now.title}”` + (now.live ? "" : " — carries on when there's room")
    : g.note || "Waiting for room on the machine";
  let h = `<div class="card self-head">
    <div class="line"><span class="big">eki works on itself</span>
      <span class="badge ${on ? (now ? "working" : "queued") : "paused"}">${on ? "On" : g ? "Paused" : "Off"}</span>
      <span class="muted" style="flex:1 1 220px;min-width:0">${esc(status)}</span>
      <button class="btn ${on ? "" : "primary"}" data-self-on="${on ? 0 : 1}">${on ? "Pause" : g ? "Resume" : "Start"}</button></div>
    <div class="muted" style="font-size:12.5px">When the machine has room it fixes what breaks in its own code, then takes the next open item in ROADMAP.md — each change in its own worktree, tested and started on a spare port before you see it.</div>
    <div class="line"><span class="muted">How far it goes alone</span>
      <div class="seg" role="group" aria-label="Autonomy"><button data-self-auto="propose" aria-pressed="${v.autonomy === "propose"}" title="A branch, a diff and its checks: you apply it">Propose</button><button data-self-auto="apply" aria-pressed="${v.autonomy === "apply"}" title="A change that passes is swapped in, watched, and rolled back if it isn't healthy">Apply here</button></div>
      <span class="areas">${Object.entries(v.areas || {}).map(([p, m]) => `<span class="area" title="Changes only to ${esc(p)}: ${esc(m)}">${esc(p)} → ${esc(m)}<button data-area-rm="${esc(p)}" title="Remove">×</button></span>`).join("")}
        <input class="input" id="area-path" placeholder="e.g. ROADMAP.md or docs/" style="width:170px">
        <select class="input" id="area-mode"><option value="apply">apply</option><option value="propose">propose</option></select>
        <button class="btn small" data-area-add>Add</button></span></div>
    <div class="line">
      <label class="check" title="Under pace for the week, and never the last 30% of a window"><input type="checkbox" id="self-spare" ${!g || g.spare ? "checked" : ""} ${g ? "" : "disabled"}> Your subscriptions' spare room</label>
      <label class="check" title="Qwen with Codex's hands may take eki's own code too"><input type="checkbox" id="self-local" ${v.local ? "checked" : ""}> Local models too</label>
      <label class="check">At most <input class="input" type="number" min="1" max="20" id="self-review" value="${esc(v.review_max)}" style="width:58px"> changes waiting for you</label>
      <label class="check" title="Fewer when your subscriptions' spare room is short; the Mac app is changed by one at a time">At most <input class="input" type="number" min="1" max="8" id="self-parallel" value="${esc(v.parallel || 1)}" style="width:58px"> at once</label></div>
    ${S.error ? `<div class="err">${esc(S.error)}</div>` : ""}</div>`;
  h += `<div class="card composer" style="margin:14px 0 0">
    <textarea class="big" id="self-text" rows="2" placeholder="What should eki change about itself?">${esc(S.selfDraft)}</textarea>
    <div class="opts"><span class="grow muted" style="font-size:12.5px">Saying “eki, make …” in any chat does the same, in that chat.</span>
      <button class="btn" data-self-ask="later" ${S.selfDraft.trim() ? "" : "disabled"}>When there's room</button>
      <button class="btn primary" data-self-ask="now" ${S.selfDraft.trim() ? "" : "disabled"}>Do it now</button></div></div>`;
  if (v.waiting.length)
    h += `<div class="section"><div class="label">Waiting for you · ${v.waiting.length}</div><div class="goals">${v.waiting.map(changeCard).join("")}</div></div>`;
  if (going.length) {
    h += `<div class="section"><div class="label">Working on · ${going.length}</div><div class="card" style="padding:2px 14px"><div class="rows">`;
    for (const i of going) h += `<div class="rowline">${i.live ? `<span class="spinner"></span>` : ""}${srcChip(i.source)}<span class="grow" title="${esc(i.title)}">${esc(i.title)}${i.live ? "" : ` <span class="muted">— carries on when there's room</span>`}</span>
      ${(i.areas || []).map(a => `<span class="chipk" title="The area it works in: nothing else starts there until it's done">${esc(a)}</span>`).join("")}</div>`;
    h += `</div></div></div>`;
  }
  if (merging.length) {
    h += `<div class="section"><div class="label">Merge queue · ${merging.length}</div><div class="card" style="padding:2px 14px"><div class="rows">`;
    merging.forEach((r, n) => h += `<div class="rowline"><span class="when">${n + 1}</span>${r.applying ? `<span class="spinner"></span>` : ""}<span class="grow" title="${esc(r.title)}">${esc(r.title)}</span>
      <span class="muted" style="font-size:12.5px">${r.applying ? "being applied" : r.live ? "waiting its turn" : "back in line when it carries on"}</span></div>`);
    h += `</div></div><div class="muted" style="font-size:12px;margin-top:6px">Finished changes are applied one at a time, in the order they finished — each put on top of what landed before it and judged again.</div></div>`;
  }
  const ahead = v.queue, nexts = v.roadmap?.next || [];
  if (ahead.length || nexts.length) {
    h += `<div class="section"><div class="label">Up next</div><div class="card" style="padding:2px 14px"><div class="rows">`;
    for (const i of ahead) h += `<div class="rowline">${i.state === "working" ? `<span class="spinner"></span>` : ""}${srcChip(i.source)}<span class="grow" title="${esc(i.title)}">${esc(i.title)}</span>
      ${i.attempts ? `<span class="when">attempt ${i.attempts + 1} of 2</span>` : ""}
      ${i.state === "queued" ? `<button class="btn small" data-iact="drop" data-id="${esc(i.id)}">Drop</button>` : ""}</div>`;
    for (const n of nexts) h += `<div class="rowline">${srcChip("roadmap")}<span class="grow" title="${esc(n.text)}">${esc(n.title)} <span class="muted">· ${esc(n.section.split(" — ")[0])}</span></span>
      <button class="btn small" data-ract="person" data-key="${esc(n.key)}" title="eki won't take this one">Leave for me</button></div>`;
    h += `</div></div><div class="muted" style="font-size:12px;margin-top:6px">ROADMAP.md: ${v.roadmap.done} done, ${v.roadmap.open} open.</div></div>`;
  }
  if (v.left.length) {
    h += `<div class="section"><div class="label">Left for you</div><div class="card" style="padding:2px 14px"><div class="rows">`;
    for (const i of v.left) h += `<div class="rowline">${srcChip(i.source)}<span class="grow" title="${esc(i.note)}">${esc(i.title)} <span class="muted">— ${esc(i.note)}</span></span>
      <button class="btn small" data-iact="retry" data-id="${esc(i.id)}">Let eki try</button></div>`;
    h += `</div></div></div>`;
  }
  const note = v.note;
  h += `<div class="section"><div class="label">Weekly note</div><div class="card" style="padding:12px 16px">`;
  if (!note) h += `<div class="muted" style="font-size:13px">A week after eki starts working on itself it writes down what it noticed, with two or three suggestions. <button class="btn small" data-note-now>Write one now</button></div>`;
  else {
    h += `<div class="muted" style="font-size:12px;margin-bottom:6px">${esc(note.id)}${note.backend ? " · by " + esc(note.backend) : ""} · <a href="#" data-note-now style="color:var(--accent);text-decoration:none">write a new one</a></div><div class="body">${md(note.text)}</div>`;
    (note.suggestions || []).forEach((sg, i) => {
      h += `<div class="suggestion"><div style="font-weight:600">${esc(sg.title)} <span class="chipk">${esc(sg.kind)}</span></div>
        <div class="muted" style="font-size:13px;margin-top:3px">${esc(sg.why)}</div>
        <div style="margin-top:7px;display:flex;gap:6px;flex-wrap:wrap">${sg.picked ? `<span class="mark done">${esc({ asked: "asked eki", roadmap: "on the roadmap", dismissed: "dismissed" }[sg.picked] || sg.picked)}</span>` :
          `<button class="btn small" data-sugg="ask" data-nid="${esc(note.id)}" data-i="${i}">Ask eki to do it</button>
           <button class="btn small" data-sugg="roadmap" data-nid="${esc(note.id)}" data-i="${i}">Add to ROADMAP</button>
           <button class="btn small" data-sugg="dismiss" data-nid="${esc(note.id)}" data-i="${i}">Dismiss</button>`}</div></div>`;
    });
  }
  h += `</div></div>`;
  const did = v.changes.filter(c => !(["proposed", "conflicts"].includes(c.state) && c.fit));
  if (did.length) {
    h += `<div class="section"><div class="label">What it did</div><div class="card" style="padding:2px 14px"><div class="rows">`;
    for (const c of did.slice(0, 30)) h += `<div class="rowline"><span class="when">${esc(when(c.state_at))}</span>
      <span class="badge ${CBADGE[c.state] || ""}">${esc(CSTATE[c.state] || c.state)}</span>${srcChip(c.source || "asked")}
      <a class="grow" href="#/self/${enc(c.id)}" style="color:inherit;text-decoration:none" title="${esc(c.title)}">${esc(c.title)}</a>
      ${c.state === "applied" ? changeActs(c, false) : ""}</div>`;
    h += `</div></div></div>`;
  }
  return h;
}

function diffHtml(text) {
  return String(text || "").split("\n").map(l => {
    const cls = /^(diff --git|\+\+\+ |--- )/.test(l) ? "file" : l.startsWith("@@") ? "hunk"
      : l.startsWith("+") ? "add" : l.startsWith("-") ? "del" : "";
    return cls ? `<span class="${cls}">${esc(l)}</span>` : esc(l);
  }).join("\n");
}

function changePage() {
  const c = S.change;
  if (!c) return `<a class="back" href="#/self">← Self</a><div class="empty">Loading…</div>`;
  let h = `<a class="back" href="#/self">← Self</a><div class="goal-head">
    <div class="text">${esc(c.title)}</div>
    <div class="meta"><span class="badge ${CBADGE[c.state] || ""}">${esc(CSTATE[c.state] || c.state)}</span>${srcChip(c.source || "asked")}
      <span>self/${esc(c.id)}</span><span>${c.backend && c.backend !== "eki" ? "written by " + esc(c.backend) : "made by eki"}</span>
      ${c.base ? `<span>on ${esc(c.base.slice(0, 10))}</span>` : ""}<span>${esc(when(c.at))}</span></div>
    ${c.verdict ? `<div class="note" style="background:var(--sunk)">${esc(c.verdict)}${c.why && !c.verdict.includes(c.why) ? " — " + esc(c.why) : ""}${c.merged ? " · " + esc(c.merged) : ""}</div>` : ""}
    ${checksOf(c) ? `<div class="meta" style="margin-top:10px">${checksOf(c)}</div>` : ""}
    <div class="acts">${changeActs(c, false)}</div>${S.error ? `<div class="err">${esc(S.error)}</div>` : ""}</div>`;
  for (const k of (c.report?.checks || []).filter(k => !k.ok && !k.skipped))
    h += `<div class="label">${esc(k.name)} failed</div><pre class="diff" style="margin-bottom:14px">${esc(k.detail)}</pre>`;
  h += `<div class="label" style="margin-top:18px">The change</div>`;
  h += S.diff === null ? `<div class="muted">Loading the diff…</div>`
     : S.diff ? `<pre class="diff">${diffHtml(S.diff)}</pre>` : `<div class="muted">Nothing was committed.</div>`;
  const turns = S.changeThread?.turns || [];
  if (turns.length) {
    h += `<div class="label" style="margin-top:22px">Its thread</div><div class="thread">`;
    for (const t of turns) {
      if (t.role === "user") { h += `<div class="turn-goal">${esc((t.content || "").replace(/^\[eki · self\]\s*/, "").slice(0, 90))}</div>`; continue; }
      if (t.role === "assistant") h += `<div class="card msg"><div class="who">${esc(t.backend || "")}</div><div class="body">${md(t.content)}</div></div>`;
    }
    h += `</div>`;
  }
  return h;
}

// ---- drawing and refreshing ------------------------------------------------------------------------
function busy() { const a = document.activeElement; return a && a.matches("textarea, input:not([type=checkbox])"); }
function draw() {
  header();
  const r = route();
  $("#main").innerHTML = r.page === "goal" ? goalPage(r) : r.page === "self" ? selfPage()
                       : r.page === "change" ? changePage() : home();
}
async function refresh(force) {
  try {
    const v = await api("/api/goals");
    // a newer board (eki updated under it): load it, unless you're in the middle of something
    if (S.page && v.page && v.page !== S.page && !S.draft.text && !S.editing && !busy() && !$("#reply")?.value) return location.reload();
    S.page = S.page || v.page;
    const r = route();
    let thread = null;
    if (r.page === "goal") {
      const g = v.goals.find(x => x.id === r.id);
      if (g?.conversation) thread = await api(`/api/conversations/${enc(g.conversation)}`).catch(() => null);
    }
    if (r.page === "self" || r.page === "change") S.self = await api("/api/self").catch(() => S.self);
    if (r.page === "change") {
      const c = await api(`/api/self/changes/${enc(r.id)}`).catch(() => null);
      if (c && S.diffFor !== c.id + (c.commit || "")) {          // the diff once per commit
        S.diffFor = c.id + (c.commit || ""); S.diff = null;
        api(`/api/self/changes/${enc(c.id)}/diff`).then(d => { S.diff = d.diff || ""; draw(); })
          .catch(e => { S.diff = ""; S.error = e.message; draw(); });
      }
      S.change = c;
      S.changeThread = c?.conversation ? await api(`/api/conversations/${enc(c.conversation)}`).catch(() => null) : null;
    }
    const sig = JSON.stringify([v.goals, v.on, v.when, thread, r, S.self, S.change, S.changeThread, S.acting]);
    S.view = v; S.thread = thread;
    if (force || (sig !== S.sig && !busy() && !S.editing)) { S.sig = sig; draw(); } else header();
  } catch (e) {
    $("#dot").className = "dot"; $("#status").textContent = "The engine isn't answering — is eki running?";
  }
}
// in the Mac app, its own folder panel (instant, a sheet on the window); in a browser, the engine's dialog
async function pickFolder(from) {
  const native = window.webkit?.messageHandlers?.ekiPickFolder;
  if (native) return (await native.postMessage({ from })) || "";
  return (await api("/api/pick-folder", "POST", { from })).path || "";
}
async function act(fn) { S.error = ""; try { await fn(); } catch (e) { S.error = e.message; } S.confirm = ""; await refresh(true); }

// ---- events ------------------------------------------------------------------------------------
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "new-text") { S.draft.text = t.value; if (!S.draft.touched) { const before = S.draft.kind + S.draft.at; guessWhen(t.value, S.draft);
      if (before !== S.draft.kind + S.draft.at) { const at = t.selectionStart; draw(); const n = $("#new-text"); n.focus(); n.setSelectionRange(at, at); return; } }
    const b = $("[data-add]"); if (b) b.disabled = !t.value.trim(); return; }
  if (t.id === "new-folder") S.draft.folder = t.value;
  if (t.id === "self-text") { S.selfDraft = t.value; for (const b of document.querySelectorAll("[data-self-ask]")) b.disabled = !t.value.trim(); return; }
  if (t.id === "edit-text") S.editDraft.text = t.value;
  if (t.id === "edit-folder") S.editDraft.folder = t.value;
  if (t.dataset.w) { const d = t.dataset.for === "new" ? S.draft : S.editDraft; d[t.dataset.w] = t.value; if (t.dataset.for === "new") d.touched = true; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "away") return act(() => api("/api/goals/mode", "POST", { when: t.checked ? "away" : "resources" }));
  if (t.id === "self-spare") return act(() => api("/api/self/on", "POST", { on: S.self?.goal?.state === "active", spare: t.checked }));
  if (t.id === "self-local") return act(() => api("/api/self/settings", "PUT", { local: t.checked }));
  if (t.id === "self-review") return act(() => api("/api/self/settings", "PUT", { review_max: Number(t.value) || 3 }));
  if (t.id === "self-parallel") return act(() => api("/api/self/settings", "PUT", { parallel: Number(t.value) || 2 }));
  if (t.id === "new-spare") S.draft.spare = t.checked;
  if (t.id === "edit-spare") S.editDraft.spare = t.checked;
  if (t.id === "new-screen") { S.draft.screen = t.checked; return draw(); }
  if (t.id === "edit-screen") { S.editDraft.screen = t.checked; return draw(); }
  for (const f of ["on_time", "fresh"]) {
    if (t.id === "new-" + f) S.draft[f] = t.checked;
    if (t.id === "edit-" + f) S.editDraft[f] = t.checked;
  }
  if (t.dataset.w === "kind") draw();
});
document.addEventListener("click", async e => {
  const t = e.target, r = route();
  const on = t.closest("[data-on]");
  if (on) return act(() => api("/api/goals/mode", "POST", { on: on.dataset.on === "1" }));
  // ---- the Self view
  const sOn = t.closest("[data-self-on]");
  if (sOn) return act(() => api("/api/self/on", "POST", { on: sOn.dataset.selfOn === "1" }));
  const auto = t.closest("[data-self-auto]");
  if (auto) return act(() => api("/api/self/settings", "PUT", { autonomy: auto.dataset.selfAuto }));
  if (t.closest("[data-area-add]")) {
    const path = $("#area-path").value.trim();
    if (!path) return;
    return act(() => api("/api/self/settings", "PUT", { areas: { ...(S.self?.areas || {}), [path]: $("#area-mode").value } }));
  }
  const arm = t.closest("[data-area-rm]");
  if (arm) { const areas = { ...(S.self?.areas || {}) }; delete areas[arm.dataset.areaRm];
             return act(() => api("/api/self/settings", "PUT", { areas })); }
  const sAsk = t.closest("[data-self-ask]");
  if (sAsk && S.selfDraft.trim()) {
    const text = S.selfDraft;
    return act(async () => { await api("/api/self", "POST", { request: text, when: sAsk.dataset.selfAsk }); S.selfDraft = ""; });
  }
  const cact = t.closest("[data-cact]");
  if (cact) {
    e.stopPropagation();
    const id = cact.dataset.id, what = cact.dataset.cact;
    S.acting[id] = { apply: "Applying — judged again if your checkout moved on", discard: "Discarding", undo: "Undoing" }[what];
    S.confirm = ""; draw();
    S.error = "";
    try { await api(`/api/self/changes/${enc(id)}/${what}`, "POST"); } catch (err) { S.error = err.message; }
    delete S.acting[id]; S.diffFor = ""; return refresh(true);
  }
  const iact = t.closest("[data-iact]");
  if (iact) return act(() => api(`/api/self/items/${enc(iact.dataset.id)}/${iact.dataset.iact}`, "POST"));
  const ract = t.closest("[data-ract]");
  if (ract) return act(() => api(`/api/self/roadmap/${enc(ract.dataset.key)}/${ract.dataset.ract}`, "POST"));
  if (t.closest("[data-note-now]")) { e.preventDefault(); return act(() => api("/api/self/note", "POST")); }
  const sugg = t.closest("[data-sugg]");
  if (sugg) return act(() => api(`/api/self/notes/${enc(sugg.dataset.nid)}/${sugg.dataset.i}/${sugg.dataset.sugg}`, "POST"));
  const pick = t.closest("[data-pick]");
  if (pick) {
    const d = pick.dataset.pick === "new" ? S.draft : S.editDraft;
    pick.disabled = true;
    try { const path = await pickFolder(d.folder || "");
          if (path) { d.folder = path; S.error = ""; } }
    catch (err) { S.error = err.message; }
    return draw();
  }
  const ex = t.closest("[data-example]");
  if (ex) { S.draft.text = ex.dataset.example; S.draft.touched = false; guessWhen(S.draft.text, S.draft); draw(); $("#new-text").focus(); return; }
  if (t.closest("[data-add]")) {
    const d = S.draft;
    return act(async () => {
      const g = await api("/api/goals", "POST", { text: d.text, when: whenOf(d), folder: d.folder, spare: d.spare, screen: d.screen, on_time: d.on_time, fresh: d.fresh });
      S.draft = { text: "", kind: "once", at: "09:00", day: "0", hours: "4", folder: "", spare: false, screen: false, on_time: false, fresh: false, touched: false };
      location.hash = "#/g/" + enc(g.id);
    });
  }
  const run = t.closest("[data-run]");
  if (run) { e.stopPropagation(); return act(() => api(`/api/goals/${enc(run.dataset.run)}/run`, "POST")); }
  const pz = t.closest("[data-pause]");
  if (pz) { e.stopPropagation(); return act(() => api(`/api/goals/${enc(pz.dataset.pause)}`, "PATCH", { state: pz.dataset.to })); }
  const ask = t.closest("[data-ask]");
  if (ask) { e.stopPropagation(); S.confirm = ask.dataset.ask; return draw(); }
  if (t.closest("[data-cancel]")) { e.stopPropagation(); S.confirm = ""; return draw(); }
  const rm = t.closest("[data-rm]");
  if (rm) { e.stopPropagation(); return act(async () => { await api(`/api/goals/${enc(rm.dataset.rm)}`, "DELETE"); location.hash = "#/"; }); }
  if (t.closest("[data-edit]")) {
    const g = S.view.goals.find(x => x.id === r.id);
    S.editDraft = { ...draftOf(g.when), text: g.text, folder: g.folder, spare: g.spare, screen: g.screen, on_time: g.on_time, fresh: g.fresh }; S.editing = true; S.error = ""; return draw();
  }
  if (t.closest("[data-cancel-edit]")) { S.editing = false; S.error = ""; return draw(); }
  if (t.closest("[data-save]")) {
    const d = S.editDraft;
    try { await api(`/api/goals/${enc(r.id)}`, "PATCH", { text: d.text, when: whenOf(d), folder: d.folder, spare: d.spare, screen: d.screen, on_time: d.on_time, fresh: d.fresh });
          S.editing = false; S.error = ""; }
    catch (err) { S.error = err.message; }
    return refresh(true);
  }
  if (t.closest("[data-send]")) {
    const g = S.view.goals.find(x => x.id === r.id), box = $("#reply");
    if (!box.value.trim()) return;
    S.sending = true; draw();
    try { await api("/api/ask", "POST", { prompt: box.value, conversation: g.conversation, repo: g.folder || "" }); }
    catch (err) { S.error = err.message; }
    S.sending = false; return refresh(true);
  }
  const op = t.closest("[data-open]");
  if (op && !t.closest("button")) location.hash = op.dataset.open === "self" ? "#/self" : "#/g/" + enc(op.dataset.open);
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
    if (e.target.id === "self-text") $('[data-self-ask="now"]')?.click();
    if (e.target.id === "new-text") $("[data-add]")?.click();
    if (e.target.id === "reply") $("[data-send]")?.click();
  }
  if (e.key === "Escape") { S.confirm = ""; if (S.editing) { S.editing = false; } draw(); }
});
window.addEventListener("hashchange", () => { S.confirm = ""; S.editing = false; S.error = ""; S.change = null; S.diff = null; S.diffFor = ""; refresh(true); });
refresh(true);
setInterval(() => refresh(false), 3000);
</script>
