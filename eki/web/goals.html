<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eki · Goals</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --sunk: #efede8; --line: #e3e0d9; --line-2: #d6d2c9;
    --ink: #1d1c1a; --ink-2: #5d5a53; --ink-3: #8f8b82;
    --accent: #c9622b; --accent-soft: #f6e3d7;
    --ok: #2f8f5b; --ok-soft: #dcefe3; --wait: #b7791f; --wait-soft: #f6ead3;
    --danger: #b3412f; --danger-soft: #f6dcd6; --info-soft: #e3e9f4; --info: #3d5f94;
    --radius: 12px; --shadow: 0 1px 2px rgba(20,18,15,.06), 0 2px 8px rgba(20,18,15,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a18; --surface: #242320; --sunk: #2c2b27; --line: #36342f; --line-2: #45423c;
      --ink: #ecebe7; --ink-2: #b3afa6; --ink-3: #807c74;
      --accent: #e0834f; --accent-soft: #3b2a20;
      --ok: #52b67f; --ok-soft: #1f3327; --wait: #d9a23e; --wait-soft: #372c19;
      --danger: #e0715e; --danger-soft: #3d2320; --info-soft: #1f2838; --info: #8fb0e6;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  button, input, select, textarea { font: inherit; }
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
           backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 980px; margin: 0 auto; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  h1 { font-size: 16px; margin: 0; font-weight: 650; } h1 a { color: inherit; text-decoration: none; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; min-width: 0; flex: 1 1 240px; }
  .status .text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .dot.working { background: var(--ok); animation: pulse 1.6s ease-in-out infinite; }
  .dot.waiting, .dot.stepped { background: var(--wait); }
  @keyframes pulse { 50% { opacity: .35; } }
  .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: none; padding: 5px 12px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  label.check { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 20px 80px; }
  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 8px;
         font-size: 12.5px; padding: 5px 12px; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-block; }
  .btn:hover { border-color: var(--line-2); color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:disabled { opacity: .5; cursor: default; }
  .btn.danger { color: var(--danger); } .btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.small { font-size: 11.5px; padding: 3px 9px; border-radius: 7px; }
  .muted { color: var(--ink-3); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  textarea.input, input.input, select.input { border: 1px solid var(--line); background: var(--surface); color: var(--ink);
                border-radius: 8px; padding: 7px 10px; font-size: 13.5px; }
  textarea.input { width: 100%; resize: vertical; }
  textarea.big { width: 100%; border: 0; padding: 4px 2px; font-size: 16px; min-height: 64px; background: transparent;
                 outline: none; resize: vertical; color: var(--ink); }
  .composer { padding: 14px 16px; margin-bottom: 22px; }
  .composer .opts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 8px;
                    padding-top: 10px; border-top: 1px solid var(--line); }
  .composer .opts .grow { flex: 1 1 200px; }
  .composer .examples { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .chip { border: 1px solid var(--line); background: var(--bg); color: var(--ink-2); border-radius: 99px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
  .chip:hover { color: var(--ink); border-color: var(--line-2); }
  .err { color: var(--danger); font-size: 12.5px; margin-top: 6px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 650; margin: 0 0 10px; }
  .goals { display: flex; flex-direction: column; gap: 10px; }
  .goal { padding: 14px 16px; cursor: pointer; }
  .goal:hover { border-color: var(--line-2); }
  .goal .top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
  .goal .text { font-weight: 600; font-size: 14.5px; line-height: 1.4; }
  .goal .meta { color: var(--ink-3); font-size: 12px; margin-top: 3px; }
  .goal .last { color: var(--ink-2); font-size: 13px; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 3;
                -webkit-box-orient: vertical; overflow: hidden; border-left: 2px solid var(--line); padding-left: 10px; }
  .goal .acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .badge { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px;
           background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
  .badge.working { background: var(--ok-soft); color: var(--ok); }
  .badge.waiting { background: var(--info-soft); color: var(--info); }
  .badge.paused, .badge.blocked { background: var(--wait-soft); color: var(--wait); }
  .badge.away { background: var(--info-soft); color: var(--info); }
  .badge.stuck { background: var(--danger-soft); color: var(--danger); }
  .confirm { display: inline-flex; gap: 6px; align-items: center; background: var(--danger-soft); color: var(--danger);
             border-radius: 9px; padding: 3px 5px 3px 10px; font-size: 12.5px; flex-wrap: wrap; }
  .empty { text-align: center; color: var(--ink-3); padding: 40px 20px; }
  .back { color: var(--ink-3); text-decoration: none; font-size: 13px; } .back:hover { color: var(--ink); }
  .goal-head { margin: 10px 0 16px; }
  .goal-head .text { font-size: 19px; font-weight: 650; line-height: 1.35; letter-spacing: -.01em; }
  .goal-head .meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--ink-3); font-size: 12.5px; margin-top: 8px; }
  .goal-head .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .note { background: var(--wait-soft); border-radius: 9px; padding: 8px 12px; font-size: 13px; margin-top: 10px; }
  .thread { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
  .turn-goal { display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
  .turn-goal::before, .turn-goal::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .msg { padding: 12px 14px; }
  .msg.you { background: var(--accent-soft); border-color: transparent; box-shadow: none; margin-left: 12%; }
  .msg .who { font-size: 11.5px; color: var(--ink-3); margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
  .msg .body { font-size: 13.5px; color: var(--ink); overflow-wrap: anywhere; }
  .body p { margin: 0 0 8px; } .body ul, .body ol { margin: 0 0 8px; padding-left: 20px; } .body li { margin-bottom: 4px; }
  .body h1, .body h2, .body h3, .body h4 { font-size: 14.5px; margin: 10px 0 6px; }
  .body pre { background: var(--sunk); border-radius: 8px; padding: 8px 10px; overflow-x: auto; font-size: 12px; }
  .body code { background: var(--sunk); border-radius: 4px; padding: 0 4px; font-size: 12.5px; }
  .body pre code { background: none; padding: 0; }
  .body img { max-width: 100%; max-height: 420px; border-radius: 9px; display: block; margin: 6px 0; }
  .body a { color: var(--accent); }
  .mark { font-size: 11px; font-weight: 650; border-radius: 99px; padding: 1px 8px; background: var(--sunk); color: var(--ink-2); }
  .mark.done { background: var(--ok-soft); color: var(--ok); } .mark.waiting { background: var(--info-soft); color: var(--info); }
  .working-line { color: var(--ok); font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .spinner { width: 12px; height: 12px; border: 2px solid var(--line-2); border-top-color: var(--ok); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .reply { margin-top: 18px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-end; }
  .reply textarea { flex: 1; border: 0; background: transparent; resize: none; outline: none; font-size: 14px; min-height: 40px; }
  .edit { padding: 14px 16px; margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  @media (max-width: 640px) { .bar { padding: 10px 16px; } main { padding: 16px 16px 60px; } .msg.you { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1><a href="#/">Goals</a></h1>
    <div class="status"><i class="dot" id="dot"></i><span class="text" id="status">Connecting…</span></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Background work">
        <button data-on="1">On</button><button data-on="0">Off</button>
      </div>
      <label class="check" title="Otherwise it runs whenever the machine has room, stepping aside for you and other apps"><input type="checkbox" id="away"> Only when I'm away</label>
    </div>
  </div>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc = encodeURIComponent;
const S = { view: null, thread: null, threadOf: "", sig: "", confirm: "", editing: false, error: "", sending: false,
            draft: { text: "", kind: "once", at: "09:00", day: "0", hours: "4", folder: "", spare: false, screen: false, touched: false } };
const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const EXAMPLES = [
  "Every morning, look at my X and propose 3 posts in my voice.",
  "Make 20 NPCs for my game — a bio, a portrait and three lines each.",
  "Keep the tests in this repo passing; fix what breaks on a branch.",
];

async function api(path, method, body) {
  const r = await fetch(path, method ? { method, headers: {"Content-Type": "application/json"},
                                         body: body === undefined ? undefined : JSON.stringify(body) } : {});
  if (!r.ok) { let m = await r.text(); try { m = JSON.parse(m).detail || m; } catch {} throw new Error(m); }
  return r.json();
}
function route() {
  const p = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  return p[0] === "g" && p[1] ? { page: "goal", id: p[1] } : { page: "home" };
}

// ---- when ----------------------------------------------------------------------------------
function whenOf(d) {
  if (d.kind === "daily") return { kind: "daily", at: d.at || "09:00" };
  if (d.kind === "weekdays") return { kind: "daily", at: d.at || "09:00", days: [0, 1, 2, 3, 4] };
  if (d.kind === "weekly") return { kind: "daily", at: d.at || "09:00", days: [Number(d.day)] };
  if (d.kind === "interval") return { kind: "interval", minutes: Math.max(15, Math.round(Number(d.hours || 4) * 60)) };
  return { kind: "once" };
}
function draftOf(when) {
  const d = { kind: "once", at: "09:00", day: "0", hours: "4" };
  if (when?.kind === "interval") { d.kind = "interval"; d.hours = String(when.minutes / 60); }
  if (when?.kind === "daily") {
    d.at = when.at; const days = when.days || [0, 1, 2, 3, 4, 5, 6];
    d.kind = days.length === 7 ? "daily" : days.join() === "0,1,2,3,4" ? "weekdays" : "weekly";
    d.day = String(days[0] ?? 0);
  }
  return d;
}
// a first guess at "when" from the words; the choice stays yours
function guessWhen(text, d) {
  const t = text.toLowerCase();
  const time = t.match(/\bat (\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/);
  if (time) {
    let h = Number(time[1]);
    if (time[3] === "pm" && h < 12) h += 12;
    if (time[3] === "am" && h === 12) h = 0;
    if (h < 24) d.at = String(h).padStart(2, "0") + ":" + (time[2] || "00");
  }
  const hours = t.match(/every (\d+) ?(hours?|h\b)/);
  const dayName = DAYS.findIndex(n => t.includes("every " + n.toLowerCase()));
  if (hours) { d.kind = "interval"; d.hours = hours[1]; }
  else if (/every hour|hourly/.test(t)) { d.kind = "interval"; d.hours = "1"; }
  else if (/weekday/.test(t)) d.kind = "weekdays";
  else if (dayName >= 0) { d.kind = "weekly"; d.day = String(dayName); }
  else if (/every week|weekly/.test(t)) { d.kind = "weekly"; d.day = "0"; }
  else if (/every (day|morning|evening|night)|daily|each (day|morning)/.test(t)) {
    d.kind = "daily"; if (!time) d.at = /evening|night/.test(t) ? "19:00" : "09:00"; }
  else d.kind = "once";
}
function whenControls(d, prefix) {
  return `<select class="input" data-w="kind" data-for="${prefix}">
      <option value="once" ${d.kind === "once" ? "selected" : ""}>Once, until it's done</option>
      <option value="daily" ${d.kind === "daily" ? "selected" : ""}>Every day</option>
      <option value="weekdays" ${d.kind === "weekdays" ? "selected" : ""}>Weekdays</option>
      <option value="weekly" ${d.kind === "weekly" ? "selected" : ""}>Every week</option>
      <option value="interval" ${d.kind === "interval" ? "selected" : ""}>Every few hours</option></select>
    ${d.kind === "weekly" ? `<select class="input" data-w="day" data-for="${prefix}">${DAYS.map((n, i) => `<option value="${i}" ${String(i) === d.day ? "selected" : ""}>on ${n}</option>`).join("")}</select>` : ""}
    ${["daily", "weekdays", "weekly"].includes(d.kind) ? `<span class="muted">at</span><input class="input" type="time" data-w="at" data-for="${prefix}" value="${esc(d.at)}">` : ""}
    ${d.kind === "interval" ? `<span class="muted">every</span><input class="input" type="number" min="0.25" step="0.25" style="width:80px" data-w="hours" data-for="${prefix}" value="${esc(d.hours)}"><span class="muted">hours</span>` : ""}`;
}

// ---- text ----------------------------------------------------------------------------------
const imgUrl = p => `/api/goals/file?path=${enc(decodeURIComponent(p))}`;
function inline(s) {
  return esc(s)
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, a, p) => /^https?:/.test(p) ? `<img alt="${a}" src="${p}">` : `<img alt="${a}" src="${imgUrl(p)}">`)
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s.,;:!?)]|$)/g, "$1<em>$2</em>");
}
function md(text) {
  let out = "", list = "", code = false, buf = [];
  const close = () => { if (list) { out += `</${list}>`; list = ""; } };
  for (const raw of String(text || "").split("\n")) {
    if (/^```/.test(raw.trim())) { if (code) { out += `<pre><code>${esc(buf.join("\n"))}</code></pre>`; buf = []; code = false; } else { close(); code = true; } continue; }
    if (code) { buf.push(raw); continue; }
    const line = raw.trim();
    if (!line) { close(); continue; }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { close(); out += `<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`; continue; }
    const ul = line.match(/^[*\-•]\s+(.*)$/), ol = line.match(/^\d+[.)]\s+(.*)$/);
    if (ul || ol) { const want = ul ? "ul" : "ol"; if (list !== want) { close(); out += `<${want}>`; list = want; }
                   out += `<li>${inline((ul || ol)[1])}</li>`; continue; }
    close(); out += `<p>${inline(line)}</p>`;
  }
  if (code) out += `<pre><code>${esc(buf.join("\n"))}</code></pre>`;
  close(); return out;
}
const MARK = /^\s*\**\s*GOAL\s*:\s*(done|continue|waiting)\b.*$/gim;
function splitMark(text) {
  let m, last = "";
  const re = new RegExp(MARK.source, "gim");
  while ((m = re.exec(text || ""))) last = m[1].toLowerCase();
  return { body: String(text || "").replace(MARK, "").trim(), mark: last };
}
const plain = t => splitMark(t).body.replace(/!\[[^\]]*\]\([^)]*\)/g, "[picture]").replace(/[#*`>]/g, "").replace(/\s+/g, " ").trim();
const STATUS = { working: "Working", queued: "Up next", scheduled: "Scheduled", waiting: "Waiting for you",
                 paused: "Paused", done: "Done", stuck: "Stuck", blocked: "Can't start", away: "When you're away" };
const ago = t => { if (!t) return ""; const s = Date.now() / 1000 - t;
  return s < 90 ? "just now" : s < 5400 ? Math.round(s / 60) + " min ago" : s < 129600 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " days ago"; };
const next = t => { if (!t) return ""; const d = new Date(t * 1000);
  return "next " + d.toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" }); };

// ---- header ---------------------------------------------------------------------------------
function header() {
  const v = S.view; if (!v) return;
  const sh = v.shift || {}, st = sh.state || "idle";
  $("#dot").className = "dot " + (st === "stepped out" ? "stepped" : st);
  const label = {working: "Working", waiting: "Waiting", idle: "Idle", off: "Off", "stepped out": "Stepped aside"}[st] || st;
  $("#status").textContent = `${label} — ${sh.why || ""}`; $("#status").title = $("#status").textContent;
  for (const b of document.querySelectorAll("[data-on]")) b.setAttribute("aria-pressed", String((b.dataset.on === "1") === v.on));
  $("#away").checked = v.when === "away";
}

// what a goal may use: your subscriptions; the screen — which needs them, and waits for you to be away
function usesChecks(d, k) {
  return `<label class="check" title="Only when that subscription is under pace for the week, and never its last 30%"><input type="checkbox" id="${k}-spare" ${d.spare || d.screen ? "checked" : ""} ${d.screen ? "disabled" : ""}> May use my subscriptions</label>
    <label class="check" title="Looking at and using the screen — its turns run only while you're away, and step out when you're back. It uses your subscriptions' spare room: that takes a model that can see."><input type="checkbox" id="${k}-screen" ${d.screen ? "checked" : ""}> May use the screen while I'm away</label>`;
}
function usesText(g) {
  return g.screen ? "uses the screen when you're away · may use your subscriptions (spare room only)"
       : g.spare ? "may use your subscriptions (spare room only)" : "only models on this machine";
}

// ---- the list ----------------------------------------------------------------------------------
function home() {
  const d = S.draft, goals = S.view?.goals || [];
  let h = `<div class="card composer">
    <textarea class="big" id="new-text" rows="2" placeholder="What should eki keep doing?">${esc(d.text)}</textarea>
    ${d.text ? "" : `<div class="examples">${EXAMPLES.map(e => `<button class="chip" data-example="${esc(e)}">${esc(e)}</button>`).join("")}</div>`}
    <div class="opts">${whenControls(d, "new")}
      <input class="input grow" id="new-folder" placeholder="Folder to work in (optional) — e.g. ~/games/ashfall" value="${esc(d.folder)}">
      ${usesChecks(d, "new")}
      <button class="btn primary" data-add ${d.text.trim() ? "" : "disabled"}>Add goal</button></div>
    ${S.error ? `<div class="err">${esc(S.error)}</div>` : ""}</div>`;
  if (!goals.length) return h + `<div class="empty">No goals yet. Write one above — the way you'd ask in a chat.<br>eki gives it turns whenever the machine has room, and you answer it in its thread.</div>`;
  h += `<div class="label">Goals</div><div class="goals">` + goals.map(g => {
    const k = "rm:" + g.id;
    const last = plain(g.last);
    return `<div class="card goal" data-open="${esc(g.id)}">
      <div class="top"><div><div class="text">${esc(g.text)}</div>
        <div class="meta">${esc(g.when_text)}${g.folder ? " · " + esc(g.folder.split("/").pop()) : ""}${g.screen ? " · uses the screen when you're away" : g.spare ? " · may use subscriptions" : ""}${g.last_backend ? " · " + esc(g.last_backend) : ""}${g.last_turn_at ? " · " + ago(g.last_turn_at) : ""}${g.status === "scheduled" ? " · " + next(g.next_at) : ""}</div></div>
        <span class="badge ${esc(g.status)}">${STATUS[g.status] || esc(g.status)}</span></div>
      ${g.note ? `<div class="meta" style="color:var(--wait)">${esc(g.note)}</div>` : ""}
      ${last ? `<div class="last">${esc(last.slice(0, 400))}</div>` : ""}
      <div class="acts">
        <button class="btn small" data-run="${esc(g.id)}">Run now</button>
        <button class="btn small" data-pause="${esc(g.id)}" data-to="${g.state === "paused" ? "active" : "paused"}">${g.state === "paused" ? "Resume" : "Pause"}</button>
        ${S.confirm === k ? `<span class="confirm">Delete this goal? Its thread stays in your history. <button class="btn small danger solid" data-rm="${esc(g.id)}">Delete</button><button class="btn small" data-cancel>Cancel</button></span>`
                          : `<button class="btn small danger" data-ask="${esc(k)}">Delete</button>`}</div></div>`;
  }).join("") + `</div>`;
  return h;
}

// ---- one goal: its thread ------------------------------------------------------------------------
function goalPage(r) {
  const g = (S.view?.goals || []).find(x => x.id === r.id);
  if (!g) return `<a class="back" href="#/">← Goals</a><div class="empty">That goal isn't here any more.</div>`;
  const k = "rm:" + g.id;
  let h = `<a class="back" href="#/">← Goals</a><div class="goal-head">`;
  if (S.editing) {
    const d = S.editDraft;
    h += `<div class="card edit"><textarea class="input" id="edit-text" rows="3">${esc(d.text)}</textarea>
      <div class="row">${whenControls(d, "edit")}</div>
      <div class="row"><input class="input" style="flex:1" id="edit-folder" placeholder="Folder to work in (optional)" value="${esc(d.folder)}">
        ${usesChecks(d, "edit")}</div>
      <div class="row"><button class="btn primary" data-save>Save</button><button class="btn" data-cancel-edit>Cancel</button>
        ${S.error ? `<span class="err">${esc(S.error)}</span>` : ""}</div></div>`;
  } else {
    h += `<div class="text">${esc(g.text)}</div>
      <div class="meta"><span class="badge ${esc(g.status)}">${STATUS[g.status] || esc(g.status)}</span>
        <span>${esc(g.when_text)}${g.status === "scheduled" ? " · " + next(g.next_at) : ""}</span>
        ${g.folder ? `<span title="${esc(g.folder)}">${esc(g.folder)}</span>` : ""}
        <span>${usesText(g)}</span>
        <span>${g.turns} turn${g.turns === 1 ? "" : "s"}</span></div>
      ${g.note ? `<div class="note">${esc(g.note)}${g.note.includes("subscription") && !g.spare && !g.screen ? " — Edit it and tick “May use my subscriptions”." : ""}</div>` : ""}
      <div class="acts"><button class="btn" data-run="${esc(g.id)}">Run now</button>
        <button class="btn" data-pause="${esc(g.id)}" data-to="${g.state === "paused" ? "active" : "paused"}">${g.state === "paused" ? "Resume" : "Pause"}</button>
        <button class="btn" data-edit>Edit</button>
        ${S.confirm === k ? `<span class="confirm">Delete this goal? Its thread stays in your history. <button class="btn small danger solid" data-rm="${esc(g.id)}">Delete</button><button class="btn small" data-cancel>Cancel</button></span>`
                          : `<button class="btn danger" data-ask="${esc(k)}">Delete</button>`}</div>`;
  }
  h += `</div><div class="thread">`;
  const turns = S.thread?.turns || [];
  if (!g.conversation) h += `<div class="empty">No turns yet — it gets its first as soon as the machine has room.</div>`;
  for (const t of turns) {
    const text = t.content || "";
    if (t.role === "user" && text.startsWith("[eki · goal")) {
      const when = text.match(/^\[eki · goal · ([^\]]+)\]/);
      h += `<div class="turn-goal">${when ? "Turn · " + esc(when[1]) : "Turn"}</div>`;
      continue;
    }
    if (t.role === "user") { h += `<div class="card msg you"><div class="who">You</div><div class="body">${md(text)}</div></div>`; continue; }
    if (t.role !== "assistant") continue;
    const { body, mark } = splitMark(text);
    h += `<div class="card msg"><div class="who">${esc(t.backend || "")}${mark ? `<span class="mark ${mark}">${mark === "done" ? "done" : mark === "waiting" ? "waiting for you" : "will carry on"}</span>` : ""}</div>
      <div class="body">${md(body)}</div></div>`;
  }
  if (S.thread?.active_run) h += `<div class="working-line"><span class="spinner"></span>Working on it…</div>`;
  h += `</div>`;
  if (g.conversation) {
    h += `<div class="card reply"><textarea id="reply" rows="2" placeholder="${g.status === "waiting" ? "Answer it — it carries on after" : "Reply in this thread — feedback it keeps in mind"}"></textarea>
      <button class="btn primary" data-send ${S.sending ? "disabled" : ""}>Send</button></div>`;
  }
  return h;
}

// ---- drawing and refreshing ------------------------------------------------------------------------
function busy() { const a = document.activeElement; return a && a.matches("textarea, input:not([type=checkbox])"); }
function draw() {
  header();
  const r = route();
  $("#main").innerHTML = r.page === "goal" ? goalPage(r) : home();
}
async function refresh(force) {
  try {
    const v = await api("/api/goals");
    const r = route();
    let thread = null;
    if (r.page === "goal") {
      const g = v.goals.find(x => x.id === r.id);
      if (g?.conversation) thread = await api(`/api/conversations/${enc(g.conversation)}`).catch(() => null);
    }
    const sig = JSON.stringify([v.goals, v.on, v.when, thread, r]);
    S.view = v; S.thread = thread;
    if (force || (sig !== S.sig && !busy() && !S.editing)) { S.sig = sig; draw(); } else header();
  } catch (e) {
    $("#dot").className = "dot"; $("#status").textContent = "The engine isn't answering — is eki running?";
  }
}
async function act(fn) { S.error = ""; try { await fn(); } catch (e) { S.error = e.message; } S.confirm = ""; await refresh(true); }

// ---- events ------------------------------------------------------------------------------------
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "new-text") { S.draft.text = t.value; if (!S.draft.touched) { const before = S.draft.kind + S.draft.at; guessWhen(t.value, S.draft);
      if (before !== S.draft.kind + S.draft.at) { const at = t.selectionStart; draw(); const n = $("#new-text"); n.focus(); n.setSelectionRange(at, at); return; } }
    const b = $("[data-add]"); if (b) b.disabled = !t.value.trim(); return; }
  if (t.id === "new-folder") S.draft.folder = t.value;
  if (t.id === "edit-text") S.editDraft.text = t.value;
  if (t.id === "edit-folder") S.editDraft.folder = t.value;
  if (t.dataset.w) { const d = t.dataset.for === "new" ? S.draft : S.editDraft; d[t.dataset.w] = t.value; if (t.dataset.for === "new") d.touched = true; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "away") return act(() => api("/api/goals/mode", "POST", { when: t.checked ? "away" : "resources" }));
  if (t.id === "new-spare") S.draft.spare = t.checked;
  if (t.id === "edit-spare") S.editDraft.spare = t.checked;
  if (t.id === "new-screen") { S.draft.screen = t.checked; return draw(); }
  if (t.id === "edit-screen") { S.editDraft.screen = t.checked; return draw(); }
  if (t.dataset.w === "kind") draw();
});
document.addEventListener("click", async e => {
  const t = e.target, r = route();
  const on = t.closest("[data-on]");
  if (on) return act(() => api("/api/goals/mode", "POST", { on: on.dataset.on === "1" }));
  const ex = t.closest("[data-example]");
  if (ex) { S.draft.text = ex.dataset.example; S.draft.touched = false; guessWhen(S.draft.text, S.draft); draw(); $("#new-text").focus(); return; }
  if (t.closest("[data-add]")) {
    const d = S.draft;
    return act(async () => {
      const g = await api("/api/goals", "POST", { text: d.text, when: whenOf(d), folder: d.folder, spare: d.spare, screen: d.screen });
      S.draft = { text: "", kind: "once", at: "09:00", day: "0", hours: "4", folder: "", spare: false, screen: false, touched: false };
      location.hash = "#/g/" + enc(g.id);
    });
  }
  const run = t.closest("[data-run]");
  if (run) { e.stopPropagation(); return act(() => api(`/api/goals/${enc(run.dataset.run)}/run`, "POST")); }
  const pz = t.closest("[data-pause]");
  if (pz) { e.stopPropagation(); return act(() => api(`/api/goals/${enc(pz.dataset.pause)}`, "PATCH", { state: pz.dataset.to })); }
  const ask = t.closest("[data-ask]");
  if (ask) { e.stopPropagation(); S.confirm = ask.dataset.ask; return draw(); }
  if (t.closest("[data-cancel]")) { e.stopPropagation(); S.confirm = ""; return draw(); }
  const rm = t.closest("[data-rm]");
  if (rm) { e.stopPropagation(); return act(async () => { await api(`/api/goals/${enc(rm.dataset.rm)}`, "DELETE"); location.hash = "#/"; }); }
  if (t.closest("[data-edit]")) {
    const g = S.view.goals.find(x => x.id === r.id);
    S.editDraft = { ...draftOf(g.when), text: g.text, folder: g.folder, spare: g.spare, screen: g.screen }; S.editing = true; S.error = ""; return draw();
  }
  if (t.closest("[data-cancel-edit]")) { S.editing = false; S.error = ""; return draw(); }
  if (t.closest("[data-save]")) {
    const d = S.editDraft;
    try { await api(`/api/goals/${enc(r.id)}`, "PATCH", { text: d.text, when: whenOf(d), folder: d.folder, spare: d.spare, screen: d.screen });
          S.editing = false; S.error = ""; }
    catch (err) { S.error = err.message; }
    return refresh(true);
  }
  if (t.closest("[data-send]")) {
    const g = S.view.goals.find(x => x.id === r.id), box = $("#reply");
    if (!box.value.trim()) return;
    S.sending = true; draw();
    try { await api("/api/ask", "POST", { prompt: box.value, conversation: g.conversation, repo: g.folder || "" }); }
    catch (err) { S.error = err.message; }
    S.sending = false; return refresh(true);
  }
  const op = t.closest("[data-open]");
  if (op && !t.closest("button")) location.hash = "#/g/" + enc(op.dataset.open);
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
    if (e.target.id === "new-text") $("[data-add]")?.click();
    if (e.target.id === "reply") $("[data-send]")?.click();
  }
  if (e.key === "Escape") { S.confirm = ""; if (S.editing) { S.editing = false; } draw(); }
});
window.addEventListener("hashchange", () => { S.confirm = ""; S.editing = false; S.error = ""; refresh(true); });
refresh(true);
setInterval(() => refresh(false), 3000);
</script>
</body>
</html>
