<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eki</title>
<link rel="stylesheet" href="/ui/style.css">
<link rel="icon" href="/ui/mark.svg" type="image/svg+xml">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="side-head" data-drag>
      <img class="mark" src="/ui/mark.svg" alt="" aria-hidden="true"><span class="brand">eki</span>
      <button id="new" class="ghost" title="New thread (⌘K)">＋ New</button>
    </div>
    <a id="pictures" href="#pictures" class="side-link">Pictures</a>
    <nav id="threads"></nav>
    <section id="machine">
      <div class="sect">Providers</div>
      <div id="providers"></div>
      <div id="engine" class="dim"></div>
    </section>
  </aside>
  <main id="main">
    <header id="head" data-drag>
      <div id="title">New thread</div>
      <div id="meta" class="dim"></div>
    </header>
    <div id="scroll"><div id="log"></div><div id="empty" class="dim">Ask anything. eki picks who answers and says why.</div></div>
    <form id="composer" autocomplete="off">
      <div id="strip" hidden></div>
      <textarea id="prompt" rows="1" placeholder="Ask eki…"></textarea>
      <div class="bar">
        <button id="attach" type="button" class="ghost" title="Attach pictures (or paste, or drop)">📎</button>
        <input id="attach-file" type="file" accept="image/*" multiple hidden>
        <select id="to" title="Who answers"><option value="">Auto</option></select>
        <input id="cwd" placeholder="folder (optional)" title="Work in this folder" spellcheck="false">
        <label class="check" title="Run when the Mac has room"><input type="checkbox" id="bg"> background</label>
        <span class="grow"></span>
        <button id="send" type="submit">Send</button>
      </div>
    </form>
  </main>
  <aside id="panel" hidden>
    <header class="panel-head" data-drag>
      <div class="pt"><b id="panel-name"></b><div id="panel-path" class="dim"></div></div>
      <a id="panel-open" class="ghost small" target="_blank" rel="noopener">Open</a>
      <button id="panel-close" class="ghost small" title="Close (Esc)">✕</button>
    </header>
    <div id="panel-body"></div>
  </aside>
</div>
<script src="/ui/md.js"></script>
<script src="/ui/cards.js"></script>
<script src="/ui/panel.js"></script>
<script src="/ui/attach.js"></script>
<script src="/ui/gallery.js"></script>
<script src="/ui/app.js"></script>
</body>
</html>
