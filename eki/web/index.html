<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eki</title>
<link rel="stylesheet" href="/ui/style.css">
<link rel="stylesheet" href="/ui/chat.css">
<link rel="stylesheet" href="/ui/station.css">
<link rel="stylesheet" href="/ui/settings.css">
<link rel="stylesheet" href="/ui/pages.css">
<link rel="stylesheet" href="/ui/docs.css">
<link rel="icon" href="/ui/mark.svg" type="image/svg+xml">
</head>
<body>
<div id="app" data-view="chat">
  <aside id="side">
    <div class="side-head" data-drag>
      <img class="mark" src="/ui/mark.svg" alt="" aria-hidden="true"><span class="brand">eki</span>
    </div>
    <nav id="views">
      <a id="new" href="#" class="side-link" title="New chat (⌘K)">New</a>
      <a id="projects" href="#projects" class="side-link">Projects</a>
      <a id="artifacts" href="#artifacts" class="side-link">Artifacts</a>
      <a id="scheduled" href="#scheduled" class="side-link">Scheduled</a>
      <a id="customize" href="#customize" class="side-link">Customize</a>
    </nav>
    <nav id="threads"></nav>
    <div id="side-foot">
      <a id="station" href="#station" class="side-link">Station</a><span class="dim">·</span><a id="settings" href="#settings" class="side-link">Settings</a>
      <button id="status" type="button" title="Providers and the machine" aria-haspopup="true" aria-expanded="false"><span id="status-dot" class="led"></span><span id="status-text" class="dim"></span></button>
      <div id="status-pop" hidden>
        <section id="machine">
          <div class="sect">Providers</div>
          <div id="providers"></div>
          <div id="engine" class="dim"></div>
          <div id="prs" hidden></div>
        </section>
      </div>
    </div>
    <div id="side-grip" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize · double-click to reset"></div>
  </aside>
  <main id="main">
    <header id="head" data-drag>
      <div id="title">New thread</div>
      <div id="meta" class="dim"></div>
    </header>
    <div id="scroll"><div id="log"></div><div id="empty" class="dim"><div class="hello">Hello.</div>Ask anything. eki picks who answers and says why.</div></div>
    <form id="composer" autocomplete="off">
      <div id="strip" hidden></div>
      <textarea id="prompt" rows="1" placeholder="Ask eki…"></textarea>
      <div class="bar">
        <button id="attach" type="button" class="icon" title="Attach pictures (or paste, or drop)">📎</button>
        <input id="attach-file" type="file" accept="image/*" multiple hidden>
        <div id="options">
          <button id="chip" type="button" class="optchip" title="Who answers, folder, background" aria-haspopup="true" aria-expanded="false">Auto</button>
          <div id="menu" class="menu" hidden>
            <label class="mrow"><span>Who answers</span><select id="to"><option value="">Auto</option></select></label>
            <label class="mrow"><span>Folder</span><input id="cwd" placeholder="optional" title="Work in this folder" spellcheck="false"></label>
            <label class="check" title="Run when the Mac has room"><input type="checkbox" id="bg"> background</label>
          </div>
        </div>
        <span class="grow"></span>
        <button id="send" type="submit" class="round" title="Send (Enter)" aria-label="Send">↑</button>
      </div>
    </form>
  </main>
  <aside id="panel" hidden>
    <div id="panel-grip" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize · double-click to reset"></div>
    <header class="panel-head" data-drag>
      <a id="panel-back" href="#" hidden></a>
      <div class="pt"><b id="panel-name"></b><div id="panel-path" class="dim"></div></div>
      <a id="panel-open" class="ghost small" target="_blank" rel="noopener">Open</a>
      <button id="panel-close" class="ghost small" title="Close (Esc)">✕</button>
    </header>
    <div id="panel-body"></div>
  </aside>
</div>
<script src="/ui/md.js"></script>
<script src="/ui/cards.js"></script>
<script src="/ui/panel.js"></script>
<script src="/ui/panelsplit.js"></script>
<script src="/ui/docview.js"></script>
<script src="/ui/doceditor.js"></script>
<script src="/ui/docopen.js"></script>
<script src="/ui/attach.js"></script>
<script src="/ui/nav.js"></script>
<script src="/ui/shellbar.js"></script>
<script src="/ui/pagereload.js"></script>
<script src="/ui/split.js"></script>
<script src="/ui/shell.js"></script>
<script src="/ui/projectspage.js"></script>
<script src="/ui/projectcards.js"></script>
<script src="/ui/projectcardskills.js"></script>
<script src="/ui/project.js"></script>
<script src="/ui/workflowcanvas.js"></script>
<script src="/ui/workflowinspect.js"></script>
<script src="/ui/workflowpage.js"></script>
<script src="/ui/newproject.js"></script>
<script src="/ui/artifacts.js"></script>
<script src="/ui/scheduled.js"></script>
<script src="/ui/scheduleform.js"></script>
<script src="/ui/customize.js"></script>
<script src="/ui/customizeskills.js"></script>
<script src="/ui/customizeconnectors.js"></script>
<script src="/ui/prs.js"></script>
<script src="/ui/station.js"></script>
<script src="/ui/settingsform.js"></script>
<script src="/ui/settingstarget.js"></script>
<script src="/ui/settingsmodels.js"></script>
<script src="/ui/settingsnotify.js"></script>
<script src="/ui/settingsself.js"></script>
<script src="/ui/settingsrows.js"></script>
<script src="/ui/settingsproviders.js"></script>
<script src="/ui/settingscomponents.js"></script>
<script src="/ui/settings.js"></script>
<script src="/ui/sidelist.js"></script>
<script src="/ui/threadmenu.js"></script>
<script src="/ui/side.js"></script>
<script src="/ui/sidestatus.js"></script>
<script src="/ui/app.js"></script>
</body>
</html>
