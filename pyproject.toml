[project]
name = "eki"
version = "0.3.0.dev0"
description = "The station on your Mac: local models and rented agents, one queue that survives restarts."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
eki-next = "eki.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eki*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
